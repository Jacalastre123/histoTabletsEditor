<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Encode+Sans+Semi+Expanded:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <title>editor</title>
    <script type="module" crossorigin src="/histoTabletsEditor/assets/index-CjztoX8P.js"></script>
    <link rel="stylesheet" crossorigin href="/histoTabletsEditor/assets/index--06YFzqv.css">
  </head>
  <body>
    <header>
      <h1>Editor for History of Tablets</h1>
      <p id="signIn"></p>
      <button id="signout">Sign out</button>
    </header>
    <main>
      <h2>Tablet submission</h2>
      <form id="tabForm">
        <h4>Main</h4>
        <label for="imag">Image: </label>
        <input type="text" name="imag"><br><br>
        <img id="preview">

        <br>
        <br>
        <label for="title">Title:</label>
        <input type="text" name="title">
        <br>
        <label for="desc">Description:</label>
        <input type="text" name="desc">
        <br>
        <label for="year">Year:</label>
        <input type="number" name="year" min="2010" max="2026">
        <br>
        <label for="refer">References:</label>
        <input type="text" name="refer">
        <br>
        <br>
        <h4>Specs</h4>
        <label for="reld">Release Date:</label>
        <input type="date" name="reld">
        <br>
        <label for="cpu">CPU:</label>
        <input type="text" name="cpu">
        <br>
        <label for="cpud">CPU Details:</label>
        <input type="text" name="cpud">
        <br>
        <label for="gpu">GPU:</label>
        <input type="text" name="gpu">
        <br>
        <label for="osr">OS Release:</label>
        <input type="text" name="osr">
        <br>
        <label for="osf">OS Final:</label>
        <input type="text" name="osf">
        <br>
        <label for="ramsto">RAM/Storage:</label>
        <input type="text" name="ramsto">
        <br>
        <button>Submit</button>
      </form>
    </main>
    <dialog id="login">
      <h3>Log in</h3>
      <p id="error"></p>
      <form id="loginForm">
        <label for="email">Email: </label>
        <input type="email" id="email" name="email">
        <br>
        <label for="password">Password: </label>
        <input type="password" id="password" name="password">
        <br>
        <button>Submit</button>
      </form>
    </dialog>
    
  </body>
</html>
