<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Encode+Sans+Semi+Expanded:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <body>
    <header>
      <h1>History of Tablets</h1>
      <form class="rangeForm">
        <input type="range" min="0" max="16" value="0" id="rangeInput">
        <div id="bar">
          
          <div id="fullBar">
        <h5 id="year">2010</h5>
          </div>

        </div>
      </form>
    </header>
    <main id="content">
      <div class="centre">
        <h2>Learn about the history of Tablets!</h2>
        <p>Use the Year Bar to learn</p>
      </div>
    </main>
    <template id="tabTemp">
       <div class="card">

        <img class="tabImg" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTSQjbfM-MxDER19sCU1MBjjBy1QzFI8KjuKTypA0utfA&s=10">
        <div>
          <h3 class="tabTitle"></h3>
          <div class="hidden">
          <p class="description"></p>
          <table>
            <tr>
              <th>Release Date</th>
              <th class="reld"></th>
            </tr>
            <tr>
              <th>CPU</th>
              <th class="cpu"></th>
            </tr>
            <tr>
              <th>CPU Speed</th>
              <th class="cpuSpeed"></th>
            </tr>
            <tr>
              <th>GPU</th>
              <th class="gpu"></th>
            </tr>
            <tr>
              <th>RAM/Storage</th>
              <th class="rams"></th>
            </tr>
            <tr>
              <th>OS (Release)</th>
              <th class="osr"></th>
            </tr>
            <tr>
              <th>OS (Final/Current)</th>
              <th class="osf"></th>
            </tr>
            
          </table>
          <p><small class="references"></small></p>
          </div>
        </div>
      </div>
    </template>
  </body>
